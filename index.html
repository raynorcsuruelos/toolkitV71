<!doctype html>
<html data-tk-app="kit" lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WL Kit Finder</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003057">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kit Finder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 48 48' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='48' height='48' rx='8' fill='%23fff'/%3E%3Cpath d='M24 4 L14 38 M24 4 L34 38' stroke='%23003057' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M21.4 13 H26.6 M18.8 22 H29.2 M16.2 31 H31.8' stroke='%23003057' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='8' y='37' width='32' height='4' rx='1' fill='%23003057'/%3E%3Cpath d='M27 4.5 L33 6.5 L27 8.5 Z' fill='%23e67e22'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#e9edf2;color:#111827;font-family:var(--tk-font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:#0066a1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{color:#6b7280}.xs{font-size:11px}.nowrap{white-space:nowrap}.b{font-weight:700}
.ico{display:inline-flex;width:16px;height:16px;flex-shrink:0}.ico svg{width:100%;height:100%}
.ico-sm{width:14px;height:14px}.ico-lg{width:32px;height:32px}

/* Shell */
.page{min-height:100vh;display:flex;justify-content:center}
.shell{width:100%;max-width:1150px;background:#fff;min-height:100vh;display:flex;flex-direction:column;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.hdr{position:relative;z-index:20;background:#003057;color:#fff;padding:10px 12px;border-bottom:1px solid var(--tk-line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;user-select:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-text{border-left:2px solid rgba(255,255,255,.25);padding-left:12px;min-width:0}
.brand-title{font-weight:700;font-size:16px;line-height:1.2}
.brand-sub{font-size:11px;color:rgba(255,255,255,.7);font-weight:500}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:2px solid rgba(0,0,0,.4);background:#002240;color:#fff;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.1);transition:all .15s}
.nav-btn:hover{background:#001830}.nav-btn:active{transform:scale(.95)}
.nav-btn.active{background:#fff;color:#003057;border-color:var(--tk-line)}
.main{flex:1}
.ftr{border-top:1px solid var(--tk-line);padding:16px;background:#f0f4f8;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;color:#475569}
@media (min-width:640px){
  .page{padding:12px 8px}
  .shell{border:1px solid var(--tk-line);border-radius:12px;min-height:0}
  .hdr{padding:14px 20px;gap:16px;border-radius:8px 8px 0 0}
  .brand-title{font-size:18px}.brand-sub{font-size:12px}
  .nav-btn{font-size:14px}
  .ftr{font-size:14px;border-radius:0 0 8px 8px}
}

/* Rig logo + hover balloon */
.logo-wrap{position:relative;flex-shrink:0}
.logo-badge{background:#fff;border-radius:6px;padding:2px 8px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.3);box-shadow:0 1px 2px rgba(0,0,0,.1);cursor:help;transition:transform .15s}
.logo-badge:hover,.logo-wrap.open .logo-badge{transform:rotate(-4deg) scale(1.05)}
.logo-badge svg{width:32px;height:32px;display:block}
@media (min-width:640px){.logo-badge{padding:4px 10px}.logo-badge svg{width:40px;height:40px}}
.balloon{position:absolute;top:100%;left:-4px;padding-top:14px;width:min(340px,calc(100vw - 24px));opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .15s,transform .15s,visibility .15s;z-index:60}
.logo-wrap:hover .balloon,.logo-wrap:focus-within .balloon,.logo-wrap.open .balloon{opacity:1;visibility:visible;transform:none}
.balloon-body{position:relative;background:#fff;color:#1f2937;border:1px solid var(--tk-line);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.5;box-shadow:0 12px 30px rgba(0,0,0,.3);user-select:text}
.balloon-body::before{content:"";position:absolute;top:-11px;left:18px;width:16px;height:16px;background:#fff;border-left:1px solid var(--tk-line);border-top:1px solid var(--tk-line);transform:rotate(45deg)}
.balloon-body a{font-weight:800;color:#0066a1;word-break:break-all}
.balloon-icon{float:left;font-size:22px;line-height:1;margin:2px 8px 0 0}

/* Sections & forms */
.sec{padding:20px;border-bottom:1px solid var(--tk-line);background:#fff}
.sec.alt{background:#f7f9fb}.sec:last-child{border-bottom:0}
@media (min-width:640px){.sec{padding:24px}}
.sec-title{font-size:14px;font-weight:700;color:#003057;text-transform:uppercase;letter-spacing:.025em;display:flex;align-items:center;gap:8px;margin:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:16px}
.stack-sm>*+*{margin-top:12px}
.grid4{display:grid;grid-template-columns:1fr;gap:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.grid4,.grid2{grid-template-columns:1fr 1fr}}
@media (min-width:1024px){.grid4{grid-template-columns:repeat(4,1fr)}}
.label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#374151;margin-bottom:4px}
.input,.select{width:100%;padding:10px;border:1px solid var(--tk-line);border-radius:8px;font-size:14px;font-weight:600;background:#fff}
.input:focus,.select:focus{outline:none;border-color:#0066a1}
.input:disabled,.select:disabled{background:#f3f4f6;color:#6b7280;border-color:#d1d5db;cursor:not-allowed}
.select{cursor:pointer}.w-auto{width:auto}
.step{width:20px;height:20px;border-radius:999px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid var(--tk-line);background:#003057;color:#fff}
.step.done{background:#1a7a3c}.step.off{background:#e5e7eb;color:#6b7280;border-color:#d1d5db}
.search-box{position:relative}
.search-box>.ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#9ca3af}
.search-big{width:100%;padding:12px 40px;font-size:16px;font-weight:500;border:1px solid var(--tk-line);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.search-big:focus{outline:none;border-color:#0066a1}
.clear-x{position:absolute;right:10px;top:50%;transform:translateY(-50%);padding:4px;border:0;background:none;border-radius:4px;cursor:pointer;display:flex}
.clear-x:hover{background:#f3f4f6}
.filter-box{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;border:1px solid var(--tk-line);border-radius:8px;padding:0 12px;background:#fff}
.filter-box:focus-within{border-color:#0066a1}
.filter-box input{width:100%;padding:8px 0;border:0;outline:none;background:transparent;font-size:14px}
.filter-box .ico{color:#94a3b8}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;border-radius:8px;border:1px solid var(--tk-line);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:all .15s;padding:8px 16px;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-navy{background:#003057;color:#fff}.btn-navy:hover{background:#002240}
.btn-blue{background:#0066a1;color:#fff}.btn-blue:hover{background:#004e7c}
.btn-green{background:#1a7a3c;color:#fff}.btn-green:hover{background:#145a2c}
.btn-red{background:#c0392b;color:#fff}.btn-red:hover{background:#962d22}
.btn-gray{background:#e5e7eb;color:#1f2937}.btn-gray:hover{background:#d1d5db}
.btn-white{background:#fff;color:#1f2937}.btn-white:hover{background:#f3f4f6}
.icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:#fff;border:1px solid #d1d5db;color:#1f2937;cursor:pointer;transition:all .15s}
.icon-btn:hover{background:#f0f7fd;border-color:#0066a1;color:#0066a1}
.icon-btn.danger:hover{background:#fef2f2;border-color:#f87171;color:#b91c1c}
.icon-btn:active{transform:scale(.9)}

/* Badges & alerts */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-navy{background:#003057;color:#fff}.badge-green{background:#1a7a3c;color:#fff}
.badge-gray{background:#e5e7eb;color:#374151;border:1px solid #d1d5db}
.badge-amber{background:#fef3c7;color:#78350f;border:1px solid #fcd34d}
.badge-red{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.badge-blue{background:#0066a1;color:#fff;border:1px solid rgba(255,255,255,.2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.alert{padding:12px;border-radius:8px;border:2px solid;font-size:13px;font-weight:500}
.alert-error{background:#fef2f2;border-color:#c0392b;color:#7f1d1d}
.alert-info{background:#f0f7fd;border-color:#0066a1;color:#003057}
.alert-success{background:#ecfdf5;border-color:#1a7a3c;color:#064e3b}
.alert-warn{background:#fff9e6;border-color:#f59e0b;color:#5a3200}

/* Cards & tables */
.card{background:#fff;border:1px solid var(--tk-line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card-hdr{background:#003057;color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--tk-line)}
.empty{border:2px dashed #d1d5db;border-radius:12px;padding:40px 16px;text-align:center;background:#fff}
.empty .ico-lg{color:#d1d5db}
.kitnum{margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:900;letter-spacing:-.025em;color:#c0392b;word-break:break-word;font-size:36px}
.kitnum.nokit{font-size:20px}
@media (min-width:640px){.kitnum{font-size:48px}.kitnum.nokit{font-size:24px}}
.eyebrow{font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.1em}
.tbl-wrap{border:1px solid var(--tk-line);border-radius:12px;overflow:hidden;background:#fff}
.tbl-bar{background:#003057;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.tbl-tools{padding:8px 12px;background:#f0f4f8;border-bottom:1px solid var(--tk-line);display:flex;align-items:center;gap:8px}
.tbl-tools input{flex:1;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;font-weight:500;background:#fff}
.tbl-tools input:focus{outline:none;border-color:#0066a1}
.tbl-scroll{overflow:auto;max-height:480px}.tbl-scroll.compact{max-height:256px}.tbl-scroll.tall{max-height:560px}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
thead{position:sticky;top:0;z-index:1}
th{background:#002B49;color:#fff;padding:8px 12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:11px;white-space:nowrap}
th.navy{background:#003057;padding:10px 12px}
td{padding:6px 12px;border-top:1px solid #e5e7eb;vertical-align:middle}
tbody tr:nth-child(even){background:rgba(249,250,251,.6)}
tbody tr:hover{background:#f0f7fd}
tr.hl{background:#fffbeb!important}
.tbl-foot{padding:8px 12px;background:#f0f4f8;border-top:1px solid var(--tk-line);font-size:11px;font-weight:600;color:#64748b}
.pn{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;color:#003057;white-space:nowrap}
.result-list{max-height:360px;overflow:auto}
.result{width:100%;text-align:left;padding:10px 16px;border:0;border-top:1px solid #e5e7eb;background:#fff;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.result:first-child{border-top:0}
.result:hover{background:#f0f7fd}
.result .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px}
.trunc{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:639px){.hide-sm{display:none}}

/* Admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px;background:#f0f4f8;border-bottom:1px solid var(--tk-line)}
.tab{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--tk-line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
.tab:hover{background:#f0f7fd}.tab:active{transform:scale(.95)}
.tab.active{background:#003057;color:#fff}
.gate{max-width:420px;margin:40px auto;padding:0 16px}
.drop{border:3px dashed #94a3b8;border-radius:12px;padding:28px 16px;text-align:center;background:#f8fafc;cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:#0066a1;background:#f0f7fd}
.drop .ico-lg{color:#0066a1}
.seg{display:inline-flex;border:1px solid var(--tk-line);border-radius:8px;overflow:hidden}
.seg button{padding:8px 14px;border:0;background:#fff;font-weight:700;font-size:13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--tk-line)}
.seg button.on{background:#003057;color:#fff}
.panel{border:1px solid var(--tk-line);border-radius:12px;padding:16px;background:#fff}
.panel h3{margin:0 0 4px;font-size:14px;color:#003057}
.panel p{margin:0 0 12px;color:#4b5563;font-size:13px}
.panel.danger{border-color:#c0392b;background:#fffafa}
.stat{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px}
.stat b{color:#003057}

/* Modal & toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:#fff;border:1px solid var(--tk-line);border-radius:12px;width:100%;max-width:512px;box-shadow:0 25px 50px -12px rgba(0,0,0,.4);overflow:hidden;display:flex;flex-direction:column;max-height:90vh;animation:pop .18s ease-out}
.dialog.sm{max-width:384px}.dialog.lg{max-width:720px}
.dialog-hdr{background:#003057;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--tk-line)}
.dialog-title{font-weight:700;font-size:16px;line-height:1.2}
.dialog-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
.dialog-x{padding:4px;border:0;background:none;color:#fff;border-radius:4px;cursor:pointer;display:flex}
.dialog-x:hover,.hdr-x:hover{background:rgba(255,255,255,.2)}
.hdr-x{padding:4px;border:0;background:none;color:#fff;border-radius:4px;cursor:pointer;display:flex}
.dialog-body{padding:20px;overflow-y:auto;flex:1}
.dialog-foot{padding:12px;background:#f3f4f6;border-top:1px solid #d1d5db;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.mr-auto{margin-right:auto}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;padding:10px 16px;border:1px solid var(--tk-line);border-radius:10px;font-weight:700;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,.25);max-width:calc(100vw - 32px);animation:pop .18s ease-out;background:#1a7a3c;color:#fff}
.toast.error{background:#c0392b}.toast.info{background:#003057}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* Latest kPod PDF finder */
.kpod-suggestions{border:1px solid var(--tk-line);border-radius:8px;background:#fff;max-height:280px;overflow:auto;margin-top:6px}
.kpod-item{display:flex;width:100%;text-align:left;align-items:center;gap:10px;padding:10px 12px;border:0;border-top:1px solid #e5e7eb;background:#fff;cursor:pointer}
.kpod-item:first-child{border-top:0}.kpod-item:hover{background:#f0f7fd}
.kpod-name{font-weight:700;color:#003057;overflow-wrap:anywhere}.kpod-path{font-size:11px;color:#6b7280;overflow-wrap:anywhere}

/* V45 mobile usability refinements: preserve original app layout and behavior. */
html{max-width:100%;-webkit-text-size-adjust:100%}
body{max-width:100%;overflow-x:hidden}
img,svg,video,canvas{max-width:100%}
input,select,textarea{max-width:100%;min-width:0}
@media(max-width:767px){
  input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:max(16px,1em)}
  button,[role=button],a{touch-action:manipulation}
  [role=dialog],[aria-modal=true]{max-width:100vw;max-height:100dvh}
  [role=dialog] > *,[aria-modal=true] > *{max-width:calc(100vw - 20px);max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain}
  table{max-width:100%}
}
@media(max-width:420px){
  .tk-tip{max-width:calc(100vw - 20px)}
}

/* V51: Kit Finder only — compact, width-safe mobile header. */
@media (max-width:850px){
 .page,.shell{width:100%!important;max-width:100%!important;min-width:0!important}
 .hdr{box-sizing:border-box!important;width:100%!important;max-width:100%!important;min-width:0!important;height:auto!important;min-height:0!important;max-height:none!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important;padding:9px 12px!important;overflow:visible!important}
 .hdr .brand{display:flex!important;align-items:center!important;gap:10px!important;width:100%!important;max-width:100%!important;min-width:0!important;flex:0 1 auto!important}
 .hdr .logo-wrap{flex:0 0 46px!important;width:46px!important;max-width:46px!important}
 .hdr .logo-badge{box-sizing:border-box!important;width:46px!important;height:46px!important;padding:4px!important;border-radius:10px!important}
 .hdr .logo-badge svg{width:32px!important;height:32px!important}
 .hdr .brand-text{flex:1 1 0!important;width:auto!important;min-width:0!important;max-width:calc(100% - 56px)!important;padding-left:10px!important}
 .hdr .brand-title{font-size:clamp(15px,4.2vw,18px)!important;line-height:1.2!important;white-space:normal!important;overflow-wrap:anywhere!important}
 .hdr .brand-sub{font-size:clamp(11px,3vw,12px)!important;line-height:1.3!important;white-space:normal!important;overflow-wrap:anywhere!important}
 .hdr .nav{box-sizing:border-box!important;display:flex!important;width:100%!important;max-width:100%!important;min-width:0!important;flex:0 1 auto!important;align-items:center!important;justify-content:flex-end!important;flex-wrap:wrap!important;gap:7px!important}
 .hdr .nav-btn{box-sizing:border-box!important;min-height:40px!important;max-width:100%!important;padding:7px 10px!important;font-size:12px!important;white-space:nowrap!important}
}
@media(max-width:420px){.hdr{padding:8px 10px!important}.hdr .nav{gap:6px!important}.hdr .nav-btn{padding:7px 9px!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"><style id="tk-theme">
/* ==========================================================================
   My Personal Tool Kit — shared design tokens, animated rig logo and the
   unified logo tooltip. Loaded by the shell AND injected into every app so
   all four tools look and behave the same.
   ========================================================================== */
:root{
  --tk-navy:#003057;
  --tk-navy-2:#0a4a7d;
  --tk-navy-deep:#001b33;
  --tk-blue:#0066a1;
  --tk-sky:#3ba7e0;
  --tk-accent:#e67e22;
  --tk-ink:#0f1c2e;
  --tk-muted:#5b6b80;
  --tk-line:#dbe3ec;
  --tk-line-strong:#c4d1df;
  --tk-surface:#ffffff;
  --tk-surface-2:#f6f9fc;
  --tk-radius:20px;
  --tk-radius-sm:12px;
  --tk-max:1200px;
  --tk-gap:20px;
  --tk-font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tk-ease:cubic-bezier(.22,.9,.28,1);
  --tk-spring:cubic-bezier(.34,1.56,.64,1);
  --tk-shadow:0 1px 2px rgba(15,28,46,.04),0 18px 48px -18px rgba(9,34,64,.28);
  --tk-page-bg:
    radial-gradient(1100px 620px at 8% -12%,rgba(0,102,161,.13),transparent 62%),
    radial-gradient(900px 520px at 108% -4%,rgba(230,126,34,.10),transparent 60%),

/* My Personal Tool Kit — marks every header rig logo as animated, wires the
   same help tooltip to it and makes it open Master Admin (which lives in the
   shell, see src/master.js). Runs in the shell and inside each embedded app. */
(function () {
  'use strict'
  if (window.__tkEnhanced) return
  window.__tkEnhanced = true

  var EMAIL = 'raynorcsuruelos@gmail.com'
  var TIP_ID = 'tk-logo-tip'
  // Only rig logos inside a header area are treated as "the logo"
  var HEADER_SEL = 'header, .hdr, .appHeader, .header, [data-tk-brand]'

  var tip = null
  var current = null
  var hideTimer = null

  function buildTip() {
    tip = document.createElement('div')
    tip.className = 'tk-tip'
    tip.id = TIP_ID
    tip.setAttribute('role', 'tooltip')
    tip.innerHTML =
      '<div class="tk-tip-head"><span class="tk-tip-ico" aria-hidden="true">💬</span>Help &amp; Updates</div>' +
      '<p class="tk-tip-body">For help, updates, corrections, contributions, questions, answers, advice, money, complaints, etc., send your message to ' +
      '<a href="mailto:' + EMAIL + '">' + EMAIL + '</a> or just come, I’m always here for <b>6 weeks</b>.</p>' +
      '<p class="tk-tip-foot"><span aria-hidden="true">🔐</span><span><b>Click the logo</b> to open Master Admin: full backup, restore, master password and Tool Kit data.</span></p>'
    document.body.appendChild(tip)
    tip.addEventListener('pointerenter', cancelHide)
    tip.addEventListener('pointerleave', scheduleHide)
    tip.addEventListener('focusout', function (e) {
      if (!tip.contains(e.relatedTarget) && !(current && current.contains(e.relatedTarget))) scheduleHide()
    })
  }

  function isRig(svg) {
    return svg.querySelector('path[d^="M27 4.5"]') && svg.querySelector('path[d^="M24 4"]')
  }

  function mark() {
    var svgs = document.querySelectorAll('svg[viewBox="0 0 48 48"]')
    for (var i = 0; i < svgs.length; i++) {
      var svg = svgs[i]
      var host = svg.parentElement
      if (!host || host.hasAttribute('data-tk-logo')) continue
      if (!svg.closest(HEADER_SEL) || !isRig(svg)) continue
      host.setAttribute('data-tk-logo', '')
      host.setAttribute('aria-describedby', TIP_ID)
      host.setAttribute('aria-haspopup', 'dialog')
      // Keyboard access, unless the logo already sits inside something focusable
      if (!host.closest('button, a, [tabindex]')) {
        host.setAttribute('tabindex', '0')
        host.setAttribute('role', 'button')
        if (!host.hasAttribute('aria-label')) host.setAttribute('aria-label', 'Open Master Admin')
      }
    }
  }

  function position(host) {
    var r = host.getBoundingClientRect()
    var vw = document.documentElement.clientWidth
    var vh = document.documentElement.clientHeight
    var w = tip.offsetWidth || 344
    var h = tip.offsetHeight || 120
    var left = Math.max(12, Math.min(r.left - 6, vw - w - 12))
    var top = r.bottom + 12
    if (top + h > vh - 8 && r.top - h - 12 > 8) top = r.top - h - 12
    tip.style.left = left + 'px'
    tip.style.top = top + 'px'
    tip.style.setProperty('--tk-tip-ax', Math.max(14, Math.min(w - 28, r.left + r.width / 2 - left - 6)) + 'px')
  }

  function show(host) {
    cancelHide()
    if (!tip) buildTip()
    if (current && current !== host) current.classList.remove('tk-open')
    current = host
    host.classList.add('tk-open')
    position(host)
    tip.classList.add('tk-show')
  }
  function hide() {
    cancelHide()
    if (tip) tip.classList.remove('tk-show')
    if (current) current.classList.remove('tk-open')
    current = null
  }
  function scheduleHide() {
    cancelHide()
    hideTimer = setTimeout(hide, 220)
  }
  function cancelHide() {
    clearTimeout(hideTimer)
  }
  function logoOf(el) {
    return el && el.closest ? el.closest('[data-tk-logo]') : null
  }
  // Master Admin is defined by the shell; embedded apps reach it through the parent
  function openMaster() {
    var m = window.TKMaster
    try { if (!m && window.parent !== window) m = window.parent.TKMaster } catch (e) {}
    if (m && m.open) m.open()
  }

  document.addEventListener('pointerover', function (e) {
    var host = logoOf(e.target)
    if (host && e.pointerType !== 'touch') show(host)
  }, true)
  document.addEventListener('pointerout', function (e) {
    var host = logoOf(e.target)

  }, true)

    var t = e.target
    // Some apps put the focus on a wrapper around the logo badge
    var host = logoOf(t) || (t && t.matches && t.matches('[tabindex]') ? t.querySelector('[data-tk-logo]') : null)

  document.addEventListener('focusout', function (e) {
    var host = logoOf(e.target) || (current && e.target.contains && e.target.contains(current) ? current : null)

/* kPod folder access uses the browser's directory picker; browser security prevents
   a normal HTML page from silently reading arbitrary folders. */
var KPOD_DB = 'wlkf-kpod-folders', KPOD_STORE = 'handles', kpodFiles = [], kpodScanToken = 0
function kpodDb() {
  return new Promise(function(resolve,reject) {
    if (!window.indexedDB) return reject(new Error('This browser cannot save the folder setting.'))
    var req = indexedDB.open(KPOD_DB,1)
    req.onupgradeneeded = function(){ req.result.createObjectStore(KPOD_STORE) }
    req.onsuccess = function(){ resolve(req.result) }; req.onerror = function(){ reject(req.error) }
  })
}
async function kpodSaveHandle(handle) {
  var db=await kpodDb()
  await new Promise(function(resolve,reject){var tx=db.transaction(KPOD_STORE,'readwrite');tx.objectStore(KPOD_STORE).put(handle,'folder');tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error)}})
  db.close()
}
async function kpodLoadHandle() {
  var db=await kpodDb()
  var value=await new Promise(function(resolve,reject){var tx=db.transaction(KPOD_STORE,'readonly'),r=tx.objectStore(KPOD_STORE).get('folder');r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})
  db.close();return value
}
async function kpodWalk(dir, prefix, list) {
  for await (const entry of dir.values()) {
    if (entry.kind === 'file' && /\.pdf$/i.test(entry.name)) { var file = await entry.getFile(); list.push({name:entry.name,path:prefix ? prefix+'/'+entry.name : entry.name,handle:entry,lastModified:file.lastModified}) }
    else if (entry.kind === 'directory') await kpodWalk(entry,prefix ? prefix+'/'+entry.name : entry.name,list)
  }
}
function kpodFinder() {
  var query='', folderLabel=h('div',{class:'muted xs',style:'margin-top:8px'},'No kPod Attachments folder selected yet.'), modifiedLabel=h('div',{class:'muted xs',style:'margin-top:4px'},'Latest PDF modified: not available yet')
  var status=h('div',{class:'muted xs',style:'margin-top:8px'},'Choose the folder containing your latest kPod PDF attachments.')
  var input=h('input',{class:'search-big kpod-search-input',placeholder:'Type a kPod PDF filename…',disabled:true, oninput:function(e){query=e.target.value;fill()}})
  var suggestions=h('div')
  var choose=btn('Set / change folder',{variant:'navy',icon:'folder',onclick:chooseFolder})
  choose.title='Set this folder to your synced kPod folder usually hidded in Document\\KPOD\\Attachments.'
  function fill(){
    var q=query.trim().toLowerCase()
    var hits=q.length ? kpodFiles.filter(function(f){return f.name.toLowerCase().includes(q)||f.path.toLowerCase().includes(q)}).slice(0,80):[]
    suggestions.replaceChildren()
    if(q.length && !hits.length) suggestions.appendChild(h('div',{class:'muted xs',style:'padding:12px'},'No matching PDF files found in the selected folder.'))
    hits.forEach(function(f){
      suggestions.appendChild(h('button',{type:'button',class:'kpod-item',onclick:async function(){
        try {
          var perm=await f.handle.queryPermission({mode:'read'})
          if(perm!=='granted') perm=await f.handle.requestPermission({mode:'read'})
          if(perm!=='granted'){toast('Folder permission was not granted.','error');return}
          var file=await f.handle.getFile(), url=URL.createObjectURL(file)
          var w=window.open(url,'_blank')
          if(!w){var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click()}
          toast('Opening '+f.name,'info')
        } catch(err){toast('Could not open PDF: '+err.message,'error')}
      }},icon('sheet'),h('span',{style:'min-width:0'},h('div',{class:'kpod-name'},f.name),h('div',{class:'kpod-path'},f.path))))
    })
  }
  async function scan(handle){
    var token=++kpodScanToken
    status.textContent='Scanning folder and subfolders for PDF files…';input.disabled=true;kpodFiles=[]
    try{
      var list=[];await kpodWalk(handle,'',list)
      if(token!==kpodScanToken)return
      kpodFiles=list.sort(function(a,b){return a.path.localeCompare(b.path)})
      folderLabel.textContent='Folder: '+handle.name+' · '+kpodFiles.length+' PDF files'
      var newest=kpodFiles.reduce(function(max,f){return Math.max(max,f.lastModified||0)},0)
      modifiedLabel.textContent='Latest PDF modified: '+(newest ? new Date(newest).toLocaleString() : 'no PDF files found')
      status.textContent='Search is limited to PDF files. Select a suggestion to open it in your browser’s PDF viewer.'
      input.disabled=false;fill()
    }catch(err){status.textContent='Unable to read this folder. Choose it again and allow access.';toast(err.message,'error')}
  }
  async function chooseFolder(){
    if(!window.showDirectoryPicker){toast('Folder search needs a Chromium-based browser with folder access support.','error');return}
    try{
      var handle=await window.showDirectoryPicker({mode:'read'})
      var perm=await handle.requestPermission({mode:'read'})
      if(perm!=='granted'){toast('Folder permission was not granted.','error');return}
      await kpodSaveHandle(handle);await scan(handle)
    }catch(err){if(err.name!=='AbortError')toast('Could not select folder: '+err.message,'error')}
  }
  ;(async function(){try{var handle=await kpodLoadHandle();if(handle){folderLabel.textContent='Saved folder: '+handle.name+' · checking access…';var p=await handle.queryPermission({mode:'read'});if(p==='granted')await scan(handle);else status.textContent='Saved folder found. Click Set / change folder to grant access and scan.'}}catch(e){status.textContent='Select a folder to begin PDF search.'}})()
  return h('section',{class:'sec alt'},
    h('h2',{class:'sec-title',style:'margin-bottom:4px'},'Check with Latest kPod files'),
    modifiedLabel,
    h('div',{class:'stack-sm',style:'margin-top:10px'},
      h('div',{class:'row between'},h('div',{style:'flex:1;min-width:220px'},folderLabel),choose),
      h('label',{class:'label'},'Search latest kPod PDF attachments'),
      h('div',{class:'search-box'},icon('search'),input),
      suggestions,status,
      h('div',{class:'muted xs'},'The folder location is saved in this browser when supported. If access is lost, select the folder again.')) )
}

function viewGate() {
  var existing = getPasscode()
  var lock = lockoutState()
  var lockedFor = lock.until - Date.now()
  var err = h('div')
  var pass = h('input', { class: 'input', type: 'password', autocomplete: existing ? 'current-password' : 'new-password', required: true, autofocus: true, id: 'gate-pass' })
  var confirm = !existing && h('input', { class: 'input', type: 'password', autocomplete: 'new-password', required: true, id: 'gate-confirm' })

  function fail(msg) { err.replaceChildren(alertBox('error', msg)) }
  function submit(e) {
    e.preventDefault()
    if (!existing) {
      if (pass.value.length < 4) return fail('Use at least 4 characters.')
      if (pass.value !== confirm.value) return fail('The passcodes don’t match.')
      if (!setPasscode(pass.value)) return fail('This browser blocked saving the passcode (private mode or storage disabled).')
      setUnlocked(true)
      toast('Passcode set. Download an updated copy from “Data & passcode” to make it permanent.')
      return renderApp()
    }
    var l = lockoutState()
    if (l.until > Date.now()) return renderApp()
    if (checkPasscode(pass.value)) {
      lsDel(LS_LOCK)
      setUnlocked(true)
      return renderApp()
    }
    l.fails = (l.until && l.until <= Date.now() ? 0 : l.fails) + 1
    l.until = 0
    if (l.fails >= MAX_ATTEMPTS) { l.until = Date.now() + LOCK_MS; l.fails = 0 }
    lsSet(LS_LOCK, l)
    if (l.until) return renderApp()
    pass.value = ''
    fail('Incorrect passcode. ' + (MAX_ATTEMPTS - l.fails) + ' attempt(s) left before a 15-minute lockout.')
  }

  setTimeout(function () { if (document.body.contains(pass)) pass.focus() }, 0)
  return h('div', { class: 'gate' },
    h('div', { class: 'card' },
      h('div', { class: 'card-hdr', style: 'justify-content:flex-start' }, icon(existing ? 'lock' : 'key'),
        h('span', { class: 'b', style: 'font-size:16px' }, existing ? 'Admin passcode' : 'Set an admin passcode')),
      lockedFor > 0
        ? h('div', { style: 'padding:20px' }, alertBox('error', 'Too many incorrect attempts. Try again in ' + Math.ceil(lockedFor / 60000) + ' minute(s).'),
          h('div', { style: 'margin-top:12px' }, btn('Back to finder', { variant: 'gray', onclick: function () { go('finder') } })))
        : h('form', { style: 'padding:20px', class: 'stack-sm', onsubmit: submit },
          h('p', { style: 'margin:0;color:#4b5563;font-size:13px' }, existing
            ? 'Enter the passcode to add, edit or delete kits and upload BOMs.'
            : 'No passcode has been set for this file yet. Choose one to protect the admin tools.'),
          err,
          h('div', null, h('label', { class: 'label', for: 'gate-pass' }, existing ? 'Passcode' : 'New passcode'), pass),
          confirm && h('div', null, h('label', { class: 'label', for: 'gate-confirm' }, 'Confirm passcode'), confirm),
          h('div', { class: 'row', style: 'justify-content:flex-end' },
            btn('Cancel', { variant: 'gray', onclick: function () { go('finder') } }),
            btn(existing ? 'Unlock' : 'Set passcode', { variant: 'green', type: 'submit', icon: 'unlock' })))))
}
